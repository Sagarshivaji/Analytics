<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Best of All — Bench Sales Analytics</title>
<link rel="stylesheet" href="shared/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  .cand-picker { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  @media (max-width: 900px) { .cand-picker { grid-template-columns: 1fr; } }
  .cand-list { border-right: 1px solid var(--border); padding-right: 12px; max-height: 640px; overflow-y: auto; }
  .cand-list-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); margin: 12px 0 4px; }
  .cand-list-item { padding: 6px 8px; border-radius: var(--radius); font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; }
  .cand-list-item:hover { background: var(--surface-alt); }
  .cand-list-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .heatmap-table { border-collapse: collapse; font-size: 10.5px; }
  .heatmap-table td, .heatmap-table th { padding: 2px; text-align: center; }
  .heatmap-cell { width: 20px; height: 18px; border-radius: 2px; }
  .heatmap-name { font-size: 11.5px; text-align: left; padding-right: 8px; white-space: nowrap; color: var(--text-secondary); }
  .profile-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
  .profile-name { font-size: 18px; font-weight: 700; }
  .profile-role { color: var(--text-secondary); font-size: 12.5px; }
  .profile-meta { display: flex; gap: 18px; font-size: 12px; color: var(--text-tertiary); margin-top: 6px; flex-wrap: wrap; }
  .featured-note { border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: var(--radius); padding: 8px 12px; font-size: 12px; margin: 14px 0 0; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
  <div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1 class="app-title">ANALYTICS</h1>
        <div class="app-subtitle">Understand candidate, recruiter and bench-sales performance</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="theme-toggle" id="theme-toggle" type="button">Theme</button>
      </div>
    </div>
    <div class="global-search">
      <span class="icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search candidate, recruiter, job, client, role..." />
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="control-bar"></div>
  <div class="filter-chip-row" id="filter-chips"></div>
  <div id="compare-readout" class="compare-readout"></div>
  <div id="tab-content"></div>
  <div class="footer-note">Last updated Sep 12, 2026, 9:00 AM · Simulated data for UX comparison</div>
  </div>
  </div>
</div>

<script src="shared/data.js"></script>
<script src="shared/app.js"></script>
<script>
const D = window.BenchData, A = window.App;
const store = A.createStore({ periodKey: "this-quarter", compareMode: "previous-year" });
A.renderSidebar(document.getElementById("sidebar"), "best");
A.wireThemeToggle(document.getElementById("theme-toggle"));
let charts = {};
let selectedCandidateId = null;
let trendGranularity = "monthly";
let topRolesMetric = "submissions";

const TABS = [
  { id: "overview", label: "Overview" },
  { id: "recruiters", label: "Recruiters" },
  { id: "candidates", label: "Candidates" },
  { id: "individual", label: "Individual" },
  { id: "pipeline", label: "Pipeline" },
  { id: "attention", label: "Needs Attention" },
  { id: "business", label: "Business" },
];
let activeTab = "overview";

function destroyCharts() { Object.values(charts).forEach((c) => c && c.destroy()); charts = {}; }
function goTo(tab, patch) { if (patch) store.set(patch); activeTab = tab; renderTabs(); renderActive(); }

function renderTabs() {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  TABS.forEach((t) => {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeTab ? " active" : "");
    el.textContent = t.label;
    el.addEventListener("click", () => goTo(t.id));
    wrap.appendChild(el);
  });
}

function renderChrome() {
  A.renderControlBar(document.getElementById("control-bar"), store, ["period", "compare", "granularity", "recruiter", "candidate", "platform", "filtersBtn"]);
  document.getElementById("open-filters-btn").addEventListener("click", () => A.openFilterDrawer(store, ["role", "client", "location", "status"]));
  A.activeFilterChips(document.getElementById("filter-chips"), store, []);
}

function renderCompareTable() {
  const range = D.resolvePeriod(store.get().periodKey);
  const cmp = D.comparePeriod(range, store.get().compareMode);
  if (!cmp) { document.getElementById("compare-readout").innerHTML = ""; return; }
  const filters = store.get();
  const cur = D.computeKPIs(range, filters), prev = D.computeKPIs(cmp, filters);
  const rows = [
    { label: "Active Candidates", cur: cur.activeCandidates, prev: prev.activeCandidates },
    { label: "Submissions", cur: cur.submissions, prev: prev.submissions },
    { label: "Interviews", cur: cur.interviews, prev: prev.interviews },
    { label: "Offers", cur: cur.offers, prev: prev.offers },
    { label: "Placements", cur: cur.placements, prev: prev.placements },
    { label: "Revenue", cur: cur.revenue, prev: prev.revenue, fmt: A.formatCurrency },
  ];
  rows.__labels = ["Previous", "Current"];
  A.renderCompareReadout(document.getElementById("compare-readout"), "Current vs. Comparison", rows);
}

function section(title, sub) {
  const s = document.createElement("div"); s.className = "section";
  if (title) s.innerHTML = `<div class="section-title">${title}</div>` + (sub ? `<div class="section-sub">${sub}</div>` : "");
  return s;
}
function card() { const c = document.createElement("div"); c.className = "card"; return c; }
function cardHeader(c, title) {
  const h = document.createElement("div"); h.className = "card-header";
  h.innerHTML = `<div class="card-title">${title}</div>`;
  const menuHost = document.createElement("div"); h.appendChild(menuHost);
  c.appendChild(h);
  return menuHost;
}
function renderSimpleTable(root, title, columns, rows, opts) {
  const s = section(title);
  const c = card(); const host = document.createElement("div"); c.appendChild(host);
  s.appendChild(c); root.appendChild(s);
  A.renderTable(host, columns, rows, opts);
}

/* ================= OVERVIEW (V1 + V2 flavor) ================= */
function renderOverview(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cmp = D.comparePeriod(range, filters.compareMode);
  const cur = D.computeKPIs(range, filters);
  const prev = cmp ? D.computeKPIs(cmp, filters) : null;
  const pd = (a, b) => (prev ? D.pctDelta(a, b) : null);

  const s1 = section("Executive Summary");
  const kpiHost = document.createElement("div");
  A.renderKPIBand(kpiHost, [
    { label: "Active Candidates", value: A.formatNumber(cur.activeCandidates), deltaPct: pd(cur.activeCandidates, prev && prev.activeCandidates) },
    { label: "Submissions", value: A.formatNumber(cur.submissions), deltaPct: pd(cur.submissions, prev && prev.submissions) },
    { label: "Matches", value: A.formatNumber(cur.matches), deltaPct: pd(cur.matches, prev && prev.matches) },
    { label: "Interviews", value: A.formatNumber(cur.interviews), deltaPct: pd(cur.interviews, prev && prev.interviews) },
    { label: "Offers", value: A.formatNumber(cur.offers), deltaPct: pd(cur.offers, prev && prev.offers) },
    { label: "Placements", value: A.formatNumber(cur.placements), deltaPct: pd(cur.placements, prev && prev.placements), onClick: () => goTo("business") },
    { label: "Interview Rate", value: A.formatPercent(cur.interviewRate * 100), deltaPct: prev ? (cur.interviewRate - prev.interviewRate) * 100 : null, deltaOpts: { label: "pts", suffix: "" } },
    { label: "Placement Rate", value: A.formatPercent(cur.placementRate * 100), deltaPct: prev ? (cur.placementRate - prev.placementRate) * 100 : null, deltaOpts: { label: "pts", suffix: "" } },
  ]);
  s1.appendChild(kpiHost); root.appendChild(s1);

  const s2 = section("Operating Trend");
  const trendCard = card();
  const trendMenu = cardHeader(trendCard, "Submissions · Interviews · Offers · Placements");
  trendCard.innerHTML += `<div class="pill-toggle" id="gran-toggle" style="margin:-34px 0 12px;float:right;">
    <button data-g="daily">Daily</button><button data-g="weekly">Weekly</button><button data-g="monthly" class="active">Monthly</button><button data-g="quarterly">Quarterly</button></div>
    <div style="clear:both"></div><div class="chart-wrap tall"><canvas id="chart-trend"></canvas></div><div class="inline-data-table" id="trend-data"></div>`;
  s2.appendChild(trendCard); root.appendChild(s2);

  const s34 = document.createElement("div"); s34.className = "section grid grid-2";
  const funnelCard = card(); cardHeader(funnelCard, "Candidate Funnel");
  funnelCard.innerHTML += `<div id="funnel-host"></div>`;
  const healthCard = card(); cardHeader(healthCard, "Candidate Health");
  healthCard.innerHTML += `<div id="health-host"></div>`;
  s34.appendChild(funnelCard); s34.appendChild(healthCard); root.appendChild(s34);

  const s5 = section("Platform Performance");
  const platCard = card(); const platMenu = cardHeader(platCard, "By platform"); platCard.innerHTML += `<div id="platform-table"></div>`;
  s5.appendChild(platCard); root.appendChild(s5);

  const s6 = section("Top Roles");
  const rolesCard = card();
  const rolesMenu = cardHeader(rolesCard, "By volume — click a bar to filter");
  rolesCard.innerHTML += `<div class="pill-toggle" id="roles-toggle" style="margin:-34px 0 12px;float:right;">
    <button data-m="submissions" class="active">Submissions</button><button data-m="interviews">Interviews</button><button data-m="placements">Placements</button></div>
    <div style="clear:both"></div><div class="chart-wrap tall"><canvas id="chart-roles"></canvas></div>`;
  s6.appendChild(rolesCard); root.appendChild(s6);

  const s7 = section("Recruiter Performance", "Volume (x) vs. placement rate (y) — bubble size = placements. Click Recruiters tab for the full breakdown.");
  const scatterCard = card(); scatterCard.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-recruiter-scatter"></canvas></div>`;
  s7.appendChild(scatterCard); root.appendChild(s7);

  const s8 = section("Executive Insights");
  const insightsCard = card(); insightsCard.innerHTML = `<ul class="insight-list" id="insights-list"></ul>`;
  s8.appendChild(insightsCard); root.appendChild(s8);

  renderTrend(filters, range);
  document.getElementById("gran-toggle").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    trendGranularity = e.target.dataset.g;
    [...e.currentTarget.children].forEach((b) => b.classList.toggle("active", b === e.target));
    renderTrend(store.get(), D.resolvePeriod(store.get().periodKey));
  });
  const trendSeries = D.seriesByGranularity(range, filters, trendGranularity);
  A.renderCardMenu(trendMenu, [{ key: "label", label: "Period" }, { key: "submissions", label: "Submissions" }, { key: "interviews", label: "Interviews" }, { key: "offers", label: "Offers" }, { key: "placements", label: "Placements" }], trendSeries, { dataHost: document.getElementById("trend-data"), filename: "trend" });

  A.renderFunnel(document.getElementById("funnel-host"), D.funnelCounts(range, filters).map((s, i) => ({ stage: i === 3 ? "Client Response" : s.stage, value: s.value })));
  A.renderStatusStack(document.getElementById("health-host"), D.candidateStatusBreakdown(filters));

  const platforms = D.platformPerformance(range, filters);
  A.renderTable(document.getElementById("platform-table"), [
    { key: "platform", label: "Platform" },
    { key: "submissions", label: "Submissions", align: "right", render: (r) => A.formatNumber(r.submissions) },
    { key: "responses", label: "Responses", align: "right", render: (r) => A.formatNumber(r.responses) },
    { key: "interviews", label: "Interviews", align: "right", render: (r) => A.formatNumber(r.interviews) },
    { key: "placements", label: "Placements", align: "right", render: (r) => A.formatNumber(r.placements) },
    { key: "interviewPct", label: "Interview %", align: "right", render: (r) => A.formatPercent(r.interviewPct) },
  ], platforms, { onRowClick: (r) => store.set({ platformId: r.id }) });
  A.renderCardMenu(platMenu, [{ key: "platform", label: "Platform" }, { key: "submissions", label: "Submissions" }, { key: "placements", label: "Placements" }], platforms, { filename: "platforms" });

  renderRolesChart(range, filters);
  document.getElementById("roles-toggle").addEventListener("click", (e) => {
    if (e.target.tagName !== "BUTTON") return;
    topRolesMetric = e.target.dataset.m;
    [...e.currentTarget.children].forEach((b) => b.classList.toggle("active", b === e.target));
    renderRolesChart(range, store.get());
  });

  const recruiters = D.recruiterPerformance(range, filters);
  charts.scatter = A.scatterChart(document.getElementById("chart-recruiter-scatter"), recruiters.map((r) => ({ x: r.submissions, y: +r.placementRate.toFixed(1), r: Math.max(4, Math.min(24, r.placements * 2)), name: r.recruiter, id: r.id })), {
    xLabel: "Submissions", yLabel: "Placement Rate (%)", color: "--chart-1", tooltip: (raw) => `${raw.x} submissions, ${raw.y}% placement rate`,
    onClick: (evt, els) => { if (els.length) store.set({ recruiterId: recruiters[els[0].index].id }); },
  });

  renderInsights(range, cmp, filters, cur, prev, platforms, D.rolePerformance(range, filters));
}
function renderTrend(filters, range) {
  if (charts.trend) charts.trend.destroy();
  const series = D.seriesByGranularity(range, filters, trendGranularity);
  charts.trend = A.lineChart(document.getElementById("chart-trend"), series.map((s) => s.label), [
    { label: "Submissions", data: series.map((s) => s.submissions), color: "--chart-1" },
    { label: "Interviews", data: series.map((s) => s.interviews), color: "--chart-4" },
    { label: "Offers", data: series.map((s) => s.offers), color: "--chart-3" },
    { label: "Placements", data: series.map((s) => s.placements), color: "--chart-2" },
  ]);
}
function renderRolesChart(range, filters) {
  if (charts.roles) charts.roles.destroy();
  const roles = D.rolePerformance(range, filters).slice(0, 8);
  charts.roles = A.horizontalBarChart(document.getElementById("chart-roles"), roles.map((r) => r.role), roles.map((r) => r[topRolesMetric]), {
    color: "--chart-1", onClick: (evt, els) => { if (els.length) store.set({ roleId: roles[els[0].index].id }); },
  });
}
function renderInsights(range, cmp, filters, cur, prev, platforms, roles) {
  const list = document.getElementById("insights-list");
  const items = [];
  if (prev) {
    const pts = ((cur.interviewRate - prev.interviewRate) * 100).toFixed(1);
    items.push(`Interview conversion ${pts >= 0 ? "increased" : "decreased"} <b>${Math.abs(pts)} percentage points</b> vs. the comparison period.`);
  }
  const bestPlatform = [...platforms].sort((a, b) => b.interviewPct - a.interviewPct)[0];
  if (bestPlatform) items.push(`<b>${bestPlatform.platform}</b> generated the strongest interview conversion at ${A.formatPercent(bestPlatform.interviewPct)}.`);
  const idle = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters) && c.idleDays >= 7 && c.status !== "Placed" && c.status !== "Inactive").length;
  items.push(`<b>${idle} candidates</b> have received no submission in the last 7 days — see <a href="#" id="link-attention" style="color:var(--accent)">Needs Attention</a>.`);
  const totalInterviews = roles.reduce((s, r) => s + r.interviews, 0) || 1;
  const topRole = [...roles].sort((a, b) => b.interviews - a.interviews)[0];
  if (topRole) items.push(`<b>${topRole.role}</b> accounts for ${((topRole.interviews / totalInterviews) * 100).toFixed(0)}% of total interviews this period.`);
  const plc = D.PLACEMENTS.filter((p) => D.inRange(p.date, range) && D.matchesFilters(p, filters));
  const revenue = plc.reduce((s, p) => s + p.value, 0);
  items.push(`Placements in this period represent an estimated <b>${A.formatCurrency(revenue)}</b> in contract value — see <a href="#" id="link-business" style="color:var(--accent)">Business</a>.`);
  list.innerHTML = items.map((i) => `<li>${i}</li>`).join("");
  const la = document.getElementById("link-attention"); if (la) la.addEventListener("click", (e) => { e.preventDefault(); goTo("attention"); });
  const lb = document.getElementById("link-business"); if (lb) lb.addEventListener("click", (e) => { e.preventDefault(); goTo("business"); });
}

/* ================= RECRUITERS (V1 + V5 workload) ================= */
function renderRecruiters(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const recruiters = D.recruiterPerformance(range, filters);
  const s1 = section("Recruiter Leaderboard");
  const t = card(); const tHost = document.createElement("div"); t.appendChild(tHost);
  s1.appendChild(t); root.appendChild(s1);
  A.renderTable(tHost, [
    { key: "recruiter", label: "Recruiter" },
    { key: "candidates", label: "Candidates", align: "right" },
    { key: "submissions", label: "Submissions", align: "right", render: (r) => A.formatNumber(r.submissions) },
    { key: "interviews", label: "Interviews", align: "right", render: (r) => A.formatNumber(r.interviews) },
    { key: "offers", label: "Offers", align: "right", render: (r) => A.formatNumber(r.offers) },
    { key: "placements", label: "Placements", align: "right", render: (r) => A.formatNumber(r.placements) },
    { key: "placementRate", label: "Placement %", align: "right", render: (r) => A.formatPercent(r.placementRate) },
    { key: "revenue", label: "Revenue", align: "right", render: (r) => A.formatCurrency(r.revenue) },
  ], recruiters, { onRowClick: (r) => store.set({ recruiterId: r.id }) });

  const s2 = section("Recruiter Workload", "Active candidates, submissions and interviews per recruiter");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-workload"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  charts.workload = A.barChart(document.getElementById("chart-workload"), recruiters.map((r) => r.recruiter), [
    { label: "Active Candidates", data: recruiters.map((r) => r.candidates), color: "--chart-1" },
    { label: "Submissions", data: recruiters.map((r) => r.submissions), color: "--chart-6" },
    { label: "Interviews", data: recruiters.map((r) => r.interviews), color: "--chart-4" },
  ], {});

  const s3 = section("Placements by Recruiter");
  const c3 = card(); c3.innerHTML = `<div class="chart-wrap"><canvas id="chart-rec-placements"></canvas></div>`;
  s3.appendChild(c3); root.appendChild(s3);
  charts.recPlacements = A.horizontalBarChart(document.getElementById("chart-rec-placements"), recruiters.map((r) => r.recruiter), recruiters.map((r) => r.placements), { color: "--chart-2" });
}

/* ================= CANDIDATES (V4) ================= */
function candidateMetrics(c, filters) {
  const range = D.resolvePeriod(store.get().periodKey);
  const subs = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.SUBMISSIONS });
  const ints = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.INTERVIEWS });
  const offs = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.OFFERS });
  const plcs = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.PLACEMENTS });
  return {
    submissions: subs.length, interviews: ints.length, offers: offs.length, placements: plcs.length,
    interviewRate: subs.length ? (ints.length / subs.length) * 100 : 0,
    offerRate: ints.length ? (offs.length / ints.length) * 100 : 0,
    placementRate: subs.length ? (plcs.length / subs.length) * 100 : 0,
  };
}
function renderCandidates(root) {
  const filters = store.get();
  const cands = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters));
  const counts = D.candidateStatusBreakdown(filters);
  const s1 = section();
  const kpiHost = document.createElement("div");
  A.renderKPIBand(kpiHost, [
    { label: "Total", value: A.formatNumber(cands.length) },
    { label: "Available", value: A.formatNumber(counts.get("Available") || 0) },
    { label: "Interviewing", value: A.formatNumber(counts.get("Interviewing") || 0) },
    { label: "Offered", value: A.formatNumber(counts.get("Offered") || 0) },
    { label: "Placed", value: A.formatNumber(counts.get("Placed") || 0) },
    { label: "At Risk", value: A.formatNumber(counts.get("At Risk") || 0) },
  ]);
  s1.appendChild(kpiHost); root.appendChild(s1);

  const s2 = section("Candidate Performance Matrix", "Submissions (x) vs. interview conversion (y) — bubble size = placements. Click a point to open its profile.");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-matrix"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  const points = cands.map((c) => {
    const m = candidateMetrics(c, filters);
    return { x: m.submissions, y: +m.interviewRate.toFixed(1), r: Math.max(3, Math.min(18, m.placements * 5 + 3)), name: c.name, id: c.id };
  });
  charts.matrix = A.scatterChart(document.getElementById("chart-matrix"), points, {
    xLabel: "Submissions", yLabel: "Interview Rate (%)", color: "--chart-4", tooltip: (raw) => `${raw.x} submissions, ${raw.y}% interview rate`,
    onClick: (evt, els) => { if (els.length) { selectedCandidateId = points[els[0].index].id; goTo("individual"); } },
  });

  const s3 = section("Candidate Activity Heatmap", "Submissions per week — last 12 weeks, top 15 candidates by volume");
  const c3 = card(); const heatHost = document.createElement("div"); heatHost.style.overflowX = "auto"; c3.appendChild(heatHost);
  s3.appendChild(c3); root.appendChild(s3);
  renderHeatmap(heatHost, cands);

  const s4 = section("Candidate Leaderboard");
  const c4 = card(); const lbHost = document.createElement("div"); c4.appendChild(lbHost);
  s4.appendChild(c4); root.appendChild(s4);
  const leaderboard = cands.map((c) => Object.assign({ name: c.name, id: c.id, role: c.role }, candidateMetrics(c, filters))).sort((a, b) => b.submissions - a.submissions).slice(0, 20);
  A.renderTable(lbHost, [
    { key: "name", label: "Candidate" }, { key: "role", label: "Role" },
    { key: "submissions", label: "Submissions", align: "right" }, { key: "interviews", label: "Interviews", align: "right" },
    { key: "offers", label: "Offers", align: "right" }, { key: "placements", label: "Placements", align: "right" },
  ], leaderboard, { onRowClick: (r) => { selectedCandidateId = r.id; goTo("individual"); } });
}
function renderHeatmap(host, cands) {
  const weeks = 12;
  const top = [...cands].map((c) => ({ c, subs: D.SUBMISSIONS.filter((s) => s.candidateId === c.id).length })).sort((a, b) => b.subs - a.subs).slice(0, 15);
  const table = document.createElement("table"); table.className = "heatmap-table";
  const thead = document.createElement("tr"); thead.appendChild(document.createElement("th"));
  const weekStarts = [];
  for (let i = weeks - 1; i >= 0; i--) weekStarts.push(new Date(D.TODAY.getFullYear(), D.TODAY.getMonth(), D.TODAY.getDate() - i * 7));
  weekStarts.forEach((w) => { const th = document.createElement("th"); th.textContent = w.toLocaleDateString("en-US", { month: "numeric", day: "numeric" }); th.style.fontSize = "9.5px"; th.style.color = "var(--text-tertiary)"; thead.appendChild(th); });
  table.appendChild(thead);
  top.forEach(({ c }) => {
    const tr = document.createElement("tr");
    const nameTd = document.createElement("td"); nameTd.className = "heatmap-name"; nameTd.textContent = c.name;
    tr.appendChild(nameTd);
    weekStarts.forEach((w) => {
      const wEnd = new Date(w.getTime() + 7 * 86400000);
      const count = D.SUBMISSIONS.filter((s) => s.candidateId === c.id && s.date >= w && s.date < wEnd).length;
      const td = document.createElement("td");
      const intensity = Math.min(1, count / 4);
      const cell = document.createElement("div"); cell.className = "heatmap-cell";
      cell.style.background = count === 0 ? "var(--surface-alt)" : `color-mix(in srgb, var(--accent) ${20 + intensity * 70}%, var(--surface-alt))`;
      cell.title = `${c.name}: ${count} submissions week of ${w.toDateString()}`;
      cell.style.cursor = "pointer";
      cell.addEventListener("click", () => { selectedCandidateId = c.id; goTo("individual"); });
      td.appendChild(cell);
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  host.innerHTML = "";
  host.appendChild(table);
}

/* ================= PIPELINE (V3, with Rate Confirmation) ================= */
const STAGE_DEFS = [
  { key: "available", label: "Available" }, { key: "matches", label: "Matched" },
  { key: "submissions", label: "Submitted" }, { key: "responses", label: "Response" },
  { key: "interviews", label: "Interview" }, { key: "offers", label: "Offer" },
  { key: "rateConfirmations", label: "Rate Confirmation" }, { key: "placements", label: "Placed" },
];
function stageValues(range, filters) {
  const kpi = D.computeKPIs(range, filters);
  const available = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters) && (c.status === "Available" || c.status === "At Risk")).length;
  return Object.assign({ available }, kpi);
}
function renderPipeline(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cmp = D.comparePeriod(range, filters.compareMode);
  const cur = stageValues(range, filters);
  const prev = cmp ? stageValues(cmp, filters) : null;

  const s1 = section("Pipeline");
  const pipeCard = card();
  const pipe = document.createElement("div"); pipe.className = "pipeline";
  STAGE_DEFS.forEach((sd, i) => {
    const val = cur[sd.key]; const prevVal = prev ? prev[sd.key] : null;
    const pct = prev ? D.pctDelta(val, prevVal) : null;
    const stage = document.createElement("div"); stage.className = "pipeline-stage";
    stage.innerHTML = `
      <div class="pipeline-stage-name">${sd.label}</div>
      <div class="pipeline-stage-value">${A.formatNumber(val)}</div>
      <div class="pipeline-stage-change">${pct == null ? "" : `<span class="${pct >= 0 ? "text-positive" : "text-negative"}">${pct >= 0 ? "+" : ""}${pct.toFixed(1)}%</span> vs prev.`}</div>
      ${i < STAGE_DEFS.length - 1 ? '<span class="pipeline-arrow">›</span>' : ""}`;
    pipe.appendChild(stage);
  });
  pipeCard.appendChild(pipe); s1.appendChild(pipeCard); root.appendChild(s1);

  const s2 = section("Pipeline Conversion");
  const convCard = card();
  const convPairs = [
    ["Submission → Response", cur.responses, cur.submissions], ["Response → Interview", cur.interviews, cur.responses],
    ["Interview → Offer", cur.offers, cur.interviews], ["Offer → Rate Confirmation", cur.rateConfirmations, cur.offers],
    ["Rate Confirmation → Placement", cur.placements, cur.rateConfirmations],
  ];
  const kpiHost = document.createElement("div");
  A.renderKPIBand(kpiHost, convPairs.map(([label, num, den]) => ({ label, value: A.formatPercent(den ? (num / den) * 100 : 0) })));
  convCard.appendChild(kpiHost); s2.appendChild(convCard); root.appendChild(s2);

  const s3 = section("Pipeline Aging", "Candidates currently on bench, grouped by days since last activity");
  const agingCard = card(); agingCard.innerHTML = `<div class="chart-wrap short"><canvas id="chart-aging"></canvas></div>`;
  s3.appendChild(agingCard); root.appendChild(s3);
  const aging = D.benchAgingBuckets(filters);
  charts.aging = A.horizontalBarChart(document.getElementById("chart-aging"), Object.keys(aging), Object.values(aging), { color: "--chart-3" });

  const s4 = section("Candidate Pipeline", "Sorted by days since last activity — longest-idle first. Click a row to open its profile.");
  const tblCard = card(); const tblHost = document.createElement("div"); tblCard.appendChild(tblHost);
  s4.appendChild(tblCard); root.appendChild(s4);
  const cands = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters) && c.status !== "Placed").sort((a, b) => b.idleDays - a.idleDays).slice(0, 30);
  A.renderTable(tblHost, [
    { key: "name", label: "Candidate" },
    { key: "status", label: "Stage", render: (r) => `<span class="badge badge-${r.status.toLowerCase().replace(/\s/g, "")}">${r.status}</span>` },
    { key: "idleDays", label: "Days", align: "right" },
    { key: "recruiter", label: "Recruiter", render: (r) => D.RECRUITERS.find((x) => x.id === r.recruiterId).name },
  ], cands, { onRowClick: (r) => { selectedCandidateId = r.id; goTo("individual"); } });
}

/* ================= NEEDS ATTENTION (V5) ================= */
function computeSignals(filters) {
  const cands = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters) && c.status !== "Placed" && c.status !== "Inactive");
  const signals = [];
  cands.forEach((c) => { if (c.idleDays >= 7) signals.push({ candidate: c, signal: `No submission ${c.idleDays}d`, severity: c.idleDays >= 30 ? "critical" : "warning", lastActivity: c.lastActivity }); });
  const upcoming = D.INTERVIEWS.filter((i) => i.outcome === "Scheduled" && D.matchesFilters(i, filters));
  upcoming.forEach((i) => { const c = D.candidateById[i.candidateId]; signals.push({ candidate: c, signal: `Interview ${i.date.getTime() === D.TODAY.getTime() ? "today" : "pending"}`, severity: "info", lastActivity: i.date }); });
  return signals;
}
function renderAttention(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cands = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters));
  const needsAction = cands.filter((c) => c.status !== "Placed" && c.status !== "Inactive" && c.idleDays >= 7).length;
  const awaitingResponse = D.SUBMISSIONS.filter((s) => D.matchesFilters(s, filters) && s.stageIndex === 0 && !s.terminal && Math.round((D.TODAY - s.date) / 86400000) <= 21).length;
  const interviewsToday = D.INTERVIEWS.filter((i) => D.matchesFilters(i, filters) && i.outcome === "Scheduled" && i.date.getTime() === D.TODAY.getTime()).length;
  const decliningCount = (() => {
    const cmp = D.comparePeriod(range, "previous-period"); let n = 0;
    cands.forEach((c) => {
      const cur = D.INTERVIEWS.filter((i) => i.candidateId === c.id && D.inRange(i.date, range)).length;
      const prevN = D.INTERVIEWS.filter((i) => i.candidateId === c.id && D.inRange(i.date, cmp)).length;
      if (prevN >= 2 && cur === 0) n++;
    });
    return n;
  })();
  const inactive7 = cands.filter((c) => c.idleDays >= 7 && c.status !== "Placed").length;

  const s1 = section("Attention Summary");
  const band = A.el("div", { class: "alert-band" });
  [
    { count: needsAction, label: "Candidates requiring action", cls: "critical" },
    { count: awaitingResponse, label: "Submissions awaiting response", cls: "" },
    { count: interviewsToday, label: "Interviews today", cls: "info" },
    { count: decliningCount, label: "Candidates with declining conversion", cls: "" },
    { count: inactive7, label: "Inactive for 7+ days", cls: "critical" },
  ].forEach((a) => {
    const c = A.el("div", { class: "alert-card " + a.cls });
    c.innerHTML = `<div class="alert-count">${A.formatNumber(a.count)}</div><div class="alert-label">${a.label}</div>`;
    band.appendChild(c);
  });
  s1.appendChild(band); root.appendChild(s1);

  const s3 = section("Needs Attention", "Click a row to open the candidate's profile.");
  const c3 = card(); const host = document.createElement("div"); c3.appendChild(host);
  s3.appendChild(c3); root.appendChild(s3);
  const signals = computeSignals(filters).sort((a, b) => b.lastActivity - a.lastActivity).slice(0, 25);
  A.renderTable(host, [
    { key: "candidate", label: "Candidate", render: (r) => r.candidate.name },
    { key: "signal", label: "Signal", render: (r) => `<span class="badge badge-${r.severity === "critical" ? "offered" : r.severity === "info" ? "interviewing" : "atrisk"}">${r.signal}</span>` },
    { key: "lastActivity", label: "Last Activity", render: (r) => A.formatDate(r.lastActivity) },
    { key: "owner", label: "Owner", render: (r) => D.RECRUITERS.find((x) => x.id === r.candidate.recruiterId).name },
  ], signals, { onRowClick: (r) => { selectedCandidateId = r.candidate.id; goTo("individual"); } });
}

/* ================= BUSINESS (V6) ================= */
function pipelineAndForecast(range, filters) {
  const openSubs = D.queryDataset({ range, filters, dataset: D.SUBMISSIONS }).filter((s) => !s.terminal && s.stageIndex < 4);
  const bestByCandidate = new Map();
  openSubs.forEach((s) => { if (!bestByCandidate.has(s.candidateId) || s.rate > bestByCandidate.get(s.candidateId)) bestByCandidate.set(s.candidateId, s.rate); });
  const avgWeeks = 26;
  const pipelineValue = [...bestByCandidate.values()].reduce((sum, rate) => sum + rate * 40 * avgWeeks, 0);
  const kpi = D.computeKPIs(range, filters);
  const forecastRevenue = pipelineValue * (kpi.placementRate || 0.02);
  return { pipelineValue, forecastRevenue, openCount: openSubs.length, openCandidates: bestByCandidate.size, placementRate: kpi.placementRate || 0.02 };
}
function renderBusiness(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cur = D.computeKPIs(range, filters);
  const pf = pipelineAndForecast(range, filters);
  const recruiters = D.recruiterPerformance(range, filters);
  const revPerRecruiter = recruiters.length ? cur.revenue / recruiters.filter((r) => r.candidates > 0).length : 0;

  const s1 = section();
  const kpiHost = document.createElement("div");
  A.renderKPIBand(kpiHost, [
    { label: "Revenue", value: A.formatCurrency(cur.revenue) },
    { label: "Placements", value: A.formatNumber(cur.placements) },
    { label: "Pipeline Value", value: A.formatCurrency(pf.pipelineValue) },
    { label: "Forecast", value: A.formatCurrency(pf.forecastRevenue) },
    { label: "Avg. Value / Placement", value: A.formatCurrency(cur.placements ? cur.revenue / cur.placements : 0) },
    { label: "Revenue / Recruiter", value: A.formatCurrency(revPerRecruiter) },
  ]);
  s1.appendChild(kpiHost); root.appendChild(s1);

  const s2 = section("Revenue Trend", "Actual vs. simple trailing forecast");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-rev-trend"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  const wideRange = [new Date(D.TODAY.getFullYear() - 1, D.TODAY.getMonth() + 1, 1), D.TODAY];
  const series = D.monthlySeries(wideRange, filters);
  const revs = series.map((s) => s.revenue);
  const avgGrowth = revs.length > 1 ? (revs[revs.length - 1] - revs[0]) / (revs.length - 1) : 0;
  const forecastPoint = revs.length ? Math.max(0, revs[revs.length - 1] + avgGrowth) : 0;
  const labels = series.map((s) => s.label).concat(["Next"]);
  const actual = revs.concat([null]);
  const forecast = revs.map(() => null); forecast[forecast.length - 1] = revs[revs.length - 1]; forecast.push(forecastPoint);
  charts.revTrend = A.lineChart(document.getElementById("chart-rev-trend"), labels, [
    { label: "Actual Revenue", data: actual, color: "--chart-2" }, { label: "Forecast", data: forecast, color: "--chart-3" },
  ]);

  const s3 = document.createElement("div"); s3.className = "section grid grid-2";
  const techCard = card(); techCard.innerHTML = `<div class="card-header"><div class="card-title">Revenue by Technology</div></div><div class="chart-wrap"><canvas id="chart-rev-tech"></canvas></div>`;
  const recCard = card(); recCard.innerHTML = `<div class="card-header"><div class="card-title">Revenue by Recruiter</div></div><div class="chart-wrap"><canvas id="chart-rev-rec"></canvas></div>`;
  s3.appendChild(techCard); s3.appendChild(recCard); root.appendChild(s3);
  const roles = D.ROLES.map((r) => {
    const rev = D.queryDataset({ range, filters, dataset: D.PLACEMENTS }).filter((p) => p.roleId === r.id).reduce((s, p) => s + p.value, 0);
    return { technology: r.tech, id: r.id, revenue: rev };
  }).sort((a, b) => b.revenue - a.revenue);
  charts.revTech = A.horizontalBarChart(document.getElementById("chart-rev-tech"), roles.map((r) => r.technology), roles.map((r) => r.revenue), {
    color: "--chart-2", onClick: (evt, els) => { if (els.length) store.set({ roleId: roles[els[0].index].id }); },
  });
  charts.revRec2 = A.horizontalBarChart(document.getElementById("chart-rev-rec"), recruiters.map((r) => r.recruiter), recruiters.map((r) => r.revenue), {
    color: "--chart-1", onClick: (evt, els) => { if (els.length) goTo("recruiters", { recruiterId: recruiters[els[0].index].id }); },
  });

  const s3b = section("Forecast Chain", "Current pipeline → probability weighting → expected outcomes → forecast revenue");
  const c3b = card(); const fcHost = document.createElement("div"); c3b.appendChild(fcHost); s3b.appendChild(c3b); root.appendChild(s3b);
  const expectedInterviews = Math.round(pf.openCount * (cur.interviewRate || 0.15));
  const expectedOffers = Math.round(expectedInterviews * (cur.offerRate ? cur.offerRate / 100 : 0.18));
  const expectedPlacements = Math.round(pf.openCount * pf.placementRate);
  A.renderFunnel(fcHost, [
    { stage: "Current Pipeline", value: pf.openCount }, { stage: "Expected Interviews", value: expectedInterviews },
    { stage: "Expected Offers", value: expectedOffers }, { stage: "Expected Placements", value: expectedPlacements },
  ]);

  const s4 = section("Business Insights");
  const c4 = card();
  const topTech = roles[0];
  const topRecruiter = [...recruiters].sort((a, b) => b.revenue - a.revenue)[0];
  const totalRev = roles.reduce((s, r) => s + r.revenue, 0) || 1;
  const bestPlatform = D.platformPerformance(range, filters).sort((a, b) => b.interviewPct - a.interviewPct)[0];
  c4.innerHTML = `<ul class="insight-list">
    <li><b>${topTech ? topTech.technology : "—"}</b> accounts for ${topTech ? ((topTech.revenue / totalRev) * 100).toFixed(0) : 0}% of placement revenue this period.</li>
    <li>Recruiter <b>${topRecruiter ? topRecruiter.recruiter : "—"}</b> contributes the highest placement value at ${A.formatCurrency(topRecruiter ? topRecruiter.revenue : 0)}.</li>
    <li><b>${bestPlatform ? bestPlatform.platform : "—"}</b> generates the highest interview efficiency at ${A.formatPercent(bestPlatform ? bestPlatform.interviewPct : 0)}.</li>
    <li>Pipeline value stands at <b>${A.formatCurrency(pf.pipelineValue)}</b> across ${pf.openCandidates} open candidates, forecasting <b>${A.formatCurrency(pf.forecastRevenue)}</b> in probability-weighted revenue.</li>
  </ul>`;
  s4.appendChild(c4); root.appendChild(s4);
}

A.wireGlobalSearch(document.getElementById("search-input"), document.getElementById("search-results"), (item) => {
  if (item.type === "candidate") { selectedCandidateId = item.id; goTo("individual"); }
  if (item.type === "recruiter") goTo("recruiters", { recruiterId: item.id });
  if (item.type === "role") store.set({ roleId: item.id });
  if (item.type === "client") store.set({ clientId: item.id });
  if (item.type === "platform") store.set({ platformId: item.id });
});
</script>
</body>
</html>
