<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simplified Analytics — Bench Sales Analytics</title>
<link rel="stylesheet" href="shared/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  .chart-wrap.donut { height: 220px; }
  .profile-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
  .profile-name { font-size: 17px; font-weight: 700; }
  .profile-role { color: var(--text-secondary); font-size: 12.5px; }
  .profile-meta { display: flex; gap: 16px; font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
  <div class="app-shell">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1 class="app-title">ANALYTICS</h1>
        <div class="app-subtitle">Understand candidate, recruiter and bench-sales performance · Version 8 — Simplified Analytics</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="theme-toggle" id="theme-toggle" type="button">Theme</button>
      </div>
    </div>
    <div class="global-search">
      <span class="icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search candidate, recruiter, job, client, role..." />
      <div class="search-results" id="search-results" hidden></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="control-bar"></div>
  <div class="filter-chip-row" id="filter-chips"></div>
  <div id="compare-readout" class="compare-readout"></div>
  <div id="tab-content"></div>
  <div class="footer-note">Last updated Sep 12, 2026, 9:00 AM · Simulated data for UX comparison</div>
  </div>
  </div>
</div>

<script src="shared/data.js"></script>
<script src="shared/app.js"></script>
<script>
const D = window.BenchData, A = window.App;
const store = A.createStore({ periodKey: "this-quarter", compareMode: "previous-year" });
A.renderSidebar(document.getElementById("sidebar"), "v8");
A.wireThemeToggle(document.getElementById("theme-toggle"));
let charts = {};

// Only three tabs: everything a first-time user needs is reachable in one
// or two clicks, and secondary filters live behind a single "Filters" button
// instead of a row of six dropdowns.
const TABS = [
  { id: "overview", label: "Overview" },
  { id: "recruiters", label: "Recruiters" },
  { id: "candidates", label: "Candidates" },
  { id: "business", label: "Business" },
];
let activeTab = "overview";

function destroyCharts() { Object.values(charts).forEach((c) => c && c.destroy()); charts = {}; }
function renderTabs() {
  const wrap = document.getElementById("tabs");
  wrap.innerHTML = "";
  TABS.forEach((t) => {
    const el = document.createElement("div");
    el.className = "tab" + (t.id === activeTab ? " active" : "");
    el.textContent = t.label;
    el.addEventListener("click", () => { activeTab = t.id; renderTabs(); renderActive(); });
    wrap.appendChild(el);
  });
}
function renderChrome() {
  // Granularity is fixed to monthly and every secondary dimension (recruiter,
  // candidate, platform, role, client, location, status) lives in the filter
  // drawer — the visible bar only ever shows the two controls people reach
  // for first: the time window and what to compare it against.
  A.renderControlBar(document.getElementById("control-bar"), store, ["period", "compare", "filtersBtn"]);
  document.getElementById("open-filters-btn").addEventListener("click", () => A.openFilterDrawer(store, ["recruiter", "candidate", "platform", "role", "client", "location", "status"]));
  A.activeFilterChips(document.getElementById("filter-chips"), store, []);
}
function renderCompareTable() {
  const range = D.resolvePeriod(store.get().periodKey);
  const cmp = D.comparePeriod(range, store.get().compareMode);
  if (!cmp) { document.getElementById("compare-readout").innerHTML = ""; return; }
  const filters = store.get();
  const cur = D.computeKPIs(range, filters), prev = D.computeKPIs(cmp, filters);
  const rows = [
    { label: "Submissions", cur: cur.submissions, prev: prev.submissions },
    { label: "Interviews", cur: cur.interviews, prev: prev.interviews },
    { label: "Placements", cur: cur.placements, prev: prev.placements },
    { label: "Revenue", cur: cur.revenue, prev: prev.revenue, fmt: A.formatCurrency },
  ];
  rows.__labels = ["Previous", "Current"];
  A.renderCompareReadout(document.getElementById("compare-readout"), "Current vs. Comparison", rows);
}
function section(title, sub) {
  const s = document.createElement("div"); s.className = "section";
  if (title) s.innerHTML = `<div class="section-title">${title}</div>` + (sub ? `<div class="section-sub">${sub}</div>` : "");
  return s;
}
function card() { const c = document.createElement("div"); c.className = "card"; return c; }
function goTo(tab, patch) { if (patch) store.set(patch); activeTab = tab; renderTabs(); renderActive(); }

/* ================= shared: candidate profile side panel ================= */
function candidateMetrics(c, range) {
  const subs = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.SUBMISSIONS });
  const ints = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.INTERVIEWS });
  const offs = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.OFFERS });
  const plcs = D.queryDataset({ range, filters: { candidateId: c.id }, dataset: D.PLACEMENTS });
  return {
    submissions: subs.length, interviews: ints.length, offers: offs.length, placements: plcs.length,
    interviewRate: subs.length ? (ints.length / subs.length) * 100 : 0,
    placementRate: subs.length ? (plcs.length / subs.length) * 100 : 0,
  };
}
function openCandidateProfile(candidateId) {
  const c = D.candidateById[candidateId];
  if (!c) return;
  A.openSidePanel(c.name, (body) => {
    const range = D.resolvePeriod(store.get().periodKey);
    const m = candidateMetrics(c, range);
    body.innerHTML = `
      <div class="profile-header">
        <div>
          <div class="profile-role">${c.role} · ${c.technology}</div>
          <div class="profile-meta">
            <span><span class="badge badge-${c.status.toLowerCase().replace(/\s/g, "")}">${c.status}</span></span>
            <span>${c.benchDays} days on bench</span>
            <span>Recruiter: ${D.RECRUITERS.find((r) => r.id === c.recruiterId).name}</span>
            <span>${c.location}</span>
            <span>$${c.rate}/hr</span>
          </div>
        </div>
      </div>`;
    const periodLabel = document.getElementById("ctl-period") ? document.getElementById("ctl-period").selectedOptions[0].textContent : "selected period";
    const kpiSectionLabel = document.createElement("div");
    kpiSectionLabel.style.cssText = "font-size:11px;color:var(--text-tertiary);margin:14px 0 6px;";
    kpiSectionLabel.textContent = `THIS PERIOD (${periodLabel.toUpperCase()})`;
    body.appendChild(kpiSectionLabel);
    const kpiHost = document.createElement("div");
    A.renderKPIBand(kpiHost, [
      { label: "Submissions", value: A.formatNumber(m.submissions) },
      { label: "Interviews", value: A.formatNumber(m.interviews) },
      { label: "Offers", value: A.formatNumber(m.offers) },
      { label: "Placements", value: A.formatNumber(m.placements) },
    ]);
    body.appendChild(kpiHost);

    const trendCard = document.createElement("div"); trendCard.className = "card"; trendCard.style.marginTop = "16px";
    trendCard.innerHTML = `<div class="card-header"><div class="card-title">Submission Trend <span style="font-weight:400;color:var(--text-tertiary);font-size:11px;">(last 12 months)</span></div></div><div class="chart-wrap short"><canvas id="panel-trend"></canvas></div>`;
    body.appendChild(trendCard);
    const wideRange = [new Date(D.TODAY.getFullYear() - 1, D.TODAY.getMonth() + 1, 1), D.TODAY];
    const series = D.monthlySeries(wideRange, { candidateId: c.id });
    charts.panelTrend = A.lineChart(document.getElementById("panel-trend"), series.map((s) => s.label), [{ label: "Submissions", data: series.map((s) => s.submissions), color: "--chart-1" }]);

    const funnelCard = document.createElement("div"); funnelCard.className = "card"; funnelCard.style.marginTop = "16px";
    funnelCard.innerHTML = `<div class="card-header"><div class="card-title">Candidate Journey <span style="font-weight:400;color:var(--text-tertiary);font-size:11px;">(all-time)</span></div></div><div id="panel-funnel"></div>`;
    body.appendChild(funnelCard);
    const candSubs = D.SUBMISSIONS.filter((s) => s.candidateId === c.id);
    A.renderFunnel(document.getElementById("panel-funnel"), [
      { stage: "Submitted", value: candSubs.length },
      { stage: "Response", value: candSubs.filter((s) => s.stageIndex >= 1).length },
      { stage: "Interview", value: D.INTERVIEWS.filter((i) => i.candidateId === c.id).length },
      { stage: "Offer", value: D.OFFERS.filter((o) => o.candidateId === c.id).length },
      { stage: "Rate Confirmed", value: D.RATE_CONFIRMATIONS.filter((r) => r.candidateId === c.id).length },
      { stage: "Placed", value: D.PLACEMENTS.filter((p) => p.candidateId === c.id).length },
    ]);

    const tblCard = document.createElement("div"); tblCard.className = "card"; tblCard.style.marginTop = "16px";
    tblCard.innerHTML = `<div class="card-header"><div class="card-title">Recent Submissions</div></div><div id="panel-jobs"></div>`;
    body.appendChild(tblCard);
    const recentSubs = candSubs.sort((a, b) => b.date - a.date).slice(0, 8);
    A.renderTable(document.getElementById("panel-jobs"), [
      { key: "client", label: "Client", render: (r) => D.CLIENTS.find((cl) => cl.id === r.clientId).name },
      { key: "platform", label: "Platform", render: (r) => D.PLATFORMS.find((p) => p.id === r.platformId).name },
      { key: "stage", label: "Stage" },
      { key: "date", label: "Date", render: (r) => A.formatDate(r.date) },
    ], recentSubs);
  });
}

/* ================= OVERVIEW ================= */
function trailingSeries(filters) {
  const range = [new Date(D.TODAY.getFullYear(), D.TODAY.getMonth() - 5, 1), D.TODAY];
  return D.monthlySeries(range, filters);
}
function renderOverview(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cmp = D.comparePeriod(range, filters.compareMode);
  const cur = D.computeKPIs(range, filters);
  const prev = cmp ? D.computeKPIs(cmp, filters) : null;
  const pd = (a, b) => (prev ? D.pctDelta(a, b) : null);

  // Attention strip first — the thing most people open a dashboard to find
  // out ("is anything broken?") shouldn't require scrolling past six charts.
  const cands = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters));
  const needsAction = cands.filter((c) => c.status !== "Placed" && c.status !== "Inactive" && c.idleDays >= 7).length;
  const interviewsToday = D.INTERVIEWS.filter((i) => D.matchesFilters(i, filters) && i.outcome === "Scheduled" && i.date.getTime() === D.TODAY.getTime()).length;
  const s0 = section();
  const strip = A.el("div", { class: "attention-strip" });
  [
    { n: needsAction, l: "candidates need a follow-up", crit: needsAction > 0, onClick: () => goTo("candidates") },
    { n: interviewsToday, l: "interviews scheduled today", crit: false, onClick: () => goTo("candidates") },
    { n: cur.placements, l: "placements this period", crit: false, onClick: () => goTo("business") },
    { n: A.formatCurrency(cur.revenue), l: "revenue this period", crit: false, onClick: () => goTo("business") },
  ].forEach((a) => {
    const item = A.el("div", { class: "item" + (a.crit ? " crit" : "") });
    item.innerHTML = `<span class="n">${typeof a.n === "number" ? A.formatNumber(a.n) : a.n}</span><span class="l">${a.l}</span>`;
    item.addEventListener("click", a.onClick);
    strip.appendChild(item);
  });
  s0.appendChild(strip); root.appendChild(s0);

  const s1 = section();
  const kpiHost = document.createElement("div");
  const trail = trailingSeries(filters);
  A.renderKPIBandSparkline(kpiHost, [
    { label: "Submissions", value: A.formatNumber(cur.submissions), deltaPct: pd(cur.submissions, prev && prev.submissions), series: trail.map((s) => s.submissions) },
    { label: "Interviews", value: A.formatNumber(cur.interviews), deltaPct: pd(cur.interviews, prev && prev.interviews), series: trail.map((s) => s.interviews) },
    { label: "Placements", value: A.formatNumber(cur.placements), deltaPct: pd(cur.placements, prev && prev.placements), series: trail.map((s) => s.placements) },
    { label: "Placement Rate", value: A.formatPercent(cur.placementRate * 100), deltaPct: prev ? (cur.placementRate - prev.placementRate) * 100 : null, deltaOpts: { label: "pts", suffix: "" }, series: trail.map((s) => (s.submissions ? (s.placements / s.submissions) * 100 : 0)) },
    { label: "Active Candidates", value: A.formatNumber(cur.activeCandidates), deltaPct: pd(cur.activeCandidates, prev && prev.activeCandidates), series: trail.map(() => cur.activeCandidates) },
    { label: "Revenue", value: A.formatCurrency(cur.revenue), deltaPct: pd(cur.revenue, prev && prev.revenue), series: trail.map((s) => s.revenue) },
  ]);
  s1.appendChild(kpiHost); root.appendChild(s1);

  const s2 = section("Volume Over Time", "Submissions, interviews and placements — stacked to show both total volume and mix.");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-area"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  const wideRange = [new Date(D.TODAY.getFullYear() - 1, D.TODAY.getMonth() + 1, 1), D.TODAY];
  const series = D.monthlySeries(wideRange, filters);
  charts.area = A.areaChart(document.getElementById("chart-area"), series.map((s) => s.label), [
    { label: "Placements", data: series.map((s) => s.placements), color: "--chart-2" },
    { label: "Interviews", data: series.map((s) => s.interviews), color: "--chart-4" },
    { label: "Submissions", data: series.map((s) => s.submissions), color: "--chart-1" },
  ], { stacked: true });

  const s3 = document.createElement("div"); s3.className = "section grid grid-2";
  const statusCard = card(); statusCard.innerHTML = `<div class="card-header"><div class="card-title">Candidate Status</div></div><div class="chart-wrap donut"><canvas id="chart-status-donut"></canvas></div>`;
  const platCard = card(); platCard.innerHTML = `<div class="card-header"><div class="card-title">Submissions by Platform</div></div><div class="chart-wrap donut"><canvas id="chart-platform-donut"></canvas></div>`;
  s3.appendChild(statusCard); s3.appendChild(platCard); root.appendChild(s3);
  const statusCounts = D.candidateStatusBreakdown(filters);
  const statusEntries = [...statusCounts.entries()].sort((a, b) => b[1] - a[1]);
  charts.statusDonut = A.donutChart(document.getElementById("chart-status-donut"), statusEntries.map((e) => e[0]), statusEntries.map((e) => e[1]), {});
  const platforms = D.platformPerformance(range, filters);
  charts.platformDonut = A.donutChart(document.getElementById("chart-platform-donut"), platforms.map((p) => p.platform), platforms.map((p) => p.submissions), {
    onClick: (evt, els) => { if (els.length) store.set({ platformId: platforms[els[0].index].id }); },
  });

  const s4 = document.createElement("div"); s4.className = "section grid grid-2";
  const funnelCard = card(); funnelCard.innerHTML = `<div class="card-header"><div class="card-title">Candidate Funnel</div></div><div id="funnel-host"></div>`;
  const radarCard = card(); radarCard.innerHTML = `<div class="card-header"><div class="card-title">Top Recruiters</div></div><div class="chart-wrap"><canvas id="chart-radar"></canvas></div>`;
  s4.appendChild(funnelCard); s4.appendChild(radarCard); root.appendChild(s4);
  A.renderFunnel(document.getElementById("funnel-host"), D.funnelCounts(range, filters).map((s, i) => ({ stage: i === 3 ? "Client Response" : s.stage, value: s.value })));
  renderRadar("chart-radar", range, filters, 4);

  const s5 = section("Insights");
  const c5 = card();
  const bestPlatform = [...platforms].sort((a, b) => b.interviewPct - a.interviewPct)[0];
  c5.innerHTML = `<ul class="insight-list">
    <li><b>${needsAction}</b> candidates have gone 7+ days without a new submission — see <a href="#" id="lk-cand" style="color:var(--accent)">Candidates</a>.</li>
    <li><b>${bestPlatform ? bestPlatform.platform : "—"}</b> converts submissions to interviews most efficiently at ${A.formatPercent(bestPlatform ? bestPlatform.interviewPct : 0)}.</li>
    <li>Placements this period represent an estimated <b>${A.formatCurrency(cur.revenue)}</b> — see <a href="#" id="lk-biz" style="color:var(--accent)">Business</a>.</li>
  </ul>`;
  s5.appendChild(c5); root.appendChild(s5);
  c5.querySelector("#lk-cand").addEventListener("click", (e) => { e.preventDefault(); goTo("candidates"); });
  c5.querySelector("#lk-biz").addEventListener("click", (e) => { e.preventDefault(); goTo("business"); });
}

function renderRadar(canvasId, range, filters, topN) {
  const recruiters = D.recruiterPerformance(range, filters).sort((a, b) => b.submissions - a.submissions).slice(0, topN);
  const metrics = ["submissions", "interviews", "offers", "placements"];
  const maxes = {}; metrics.forEach((m) => { maxes[m] = Math.max(...recruiters.map((r) => r[m]), 1); });
  const maxRate = Math.max(...recruiters.map((r) => r.placementRate), 1);
  const labels = ["Submissions", "Interviews", "Offers", "Placements", "Placement Rate"];
  const palette = ["--chart-1", "--chart-2", "--chart-3", "--chart-4", "--chart-5", "--chart-6"];
  const series = recruiters.map((r, i) => ({
    label: r.recruiter, color: palette[i % palette.length],
    data: [(r.submissions / maxes.submissions) * 100, (r.interviews / maxes.interviews) * 100, (r.offers / maxes.offers) * 100, (r.placements / maxes.placements) * 100, (r.placementRate / maxRate) * 100].map((v) => +v.toFixed(1)),
  }));
  const key = canvasId === "chart-radar" ? "radar" : "radarAll";
  if (charts[key]) charts[key].destroy();
  charts[key] = A.radarChart(document.getElementById(canvasId), labels, series);
}

/* ================= RECRUITERS ================= */
function renderRecruiters(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const recruiters = D.recruiterPerformance(range, filters);
  const s1 = section("Recruiter Leaderboard");
  const t = card(); const tHost = document.createElement("div"); t.appendChild(tHost);
  s1.appendChild(t); root.appendChild(s1);
  A.renderTable(tHost, [
    { key: "recruiter", label: "Recruiter" }, { key: "candidates", label: "Candidates", align: "right" },
    { key: "submissions", label: "Submissions", align: "right" }, { key: "interviews", label: "Interviews", align: "right" },
    { key: "placements", label: "Placements", align: "right" }, { key: "placementRate", label: "Placement %", align: "right", render: (r) => A.formatPercent(r.placementRate) },
    { key: "revenue", label: "Revenue", align: "right", render: (r) => A.formatCurrency(r.revenue) },
  ], recruiters, { onRowClick: (r) => store.set({ recruiterId: r.id }) });

  const s2 = section("All Recruiters, Compared", "Normalized across five dimensions — 100 = the top performer on that dimension.");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-radar-all"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  renderRadar("chart-radar-all", range, filters, 6);

  const s3 = section("Recruiter Workload");
  const c3 = card(); c3.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-workload"></canvas></div>`;
  s3.appendChild(c3); root.appendChild(s3);
  charts.workload = A.barChart(document.getElementById("chart-workload"), recruiters.map((r) => r.recruiter), [
    { label: "Submissions", data: recruiters.map((r) => r.submissions), color: "--chart-1" },
    { label: "Interviews", data: recruiters.map((r) => r.interviews), color: "--chart-4" },
    { label: "Placements", data: recruiters.map((r) => r.placements), color: "--chart-2" },
  ], { stacked: true });
}

/* ================= CANDIDATES ================= */
function renderCandidates(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cands = D.CANDIDATES.filter((c) => D.matchesFilters(c, filters));
  const counts = D.candidateStatusBreakdown(filters);

  const s1 = section();
  const kpiHost = document.createElement("div");
  A.renderKPIBand(kpiHost, [
    { label: "Total", value: A.formatNumber(cands.length) },
    { label: "Available", value: A.formatNumber(counts.get("Available") || 0) },
    { label: "Interviewing", value: A.formatNumber(counts.get("Interviewing") || 0) },
    { label: "Placed", value: A.formatNumber(counts.get("Placed") || 0) },
    { label: "At Risk", value: A.formatNumber(counts.get("At Risk") || 0) },
  ]);
  s1.appendChild(kpiHost); root.appendChild(s1);

  const s2 = section("Performance Matrix", "Submissions (x) vs. interview conversion (y) — bubble size = placements. Click a point to open that candidate's profile.");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-matrix"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  const points = cands.map((c) => {
    const m = candidateMetrics(c, range);
    return { x: m.submissions, y: +m.interviewRate.toFixed(1), r: Math.max(3, Math.min(18, m.placements * 5 + 3)), name: c.name, id: c.id };
  });
  charts.matrix = A.scatterChart(document.getElementById("chart-matrix"), points, {
    xLabel: "Submissions", yLabel: "Interview Rate (%)", color: "--chart-4", tooltip: (raw) => `${raw.x} submissions, ${raw.y}% interview rate`,
    onClick: (evt, els) => { if (els.length) openCandidateProfile(points[els[0].index].id); },
  });

  const s3 = document.createElement("div"); s3.className = "section grid grid-2";
  const donutCard = card(); donutCard.innerHTML = `<div class="card-header"><div class="card-title">Status Mix</div></div><div class="chart-wrap donut"><canvas id="chart-cand-donut"></canvas></div>`;
  const agingCard = card(); agingCard.innerHTML = `<div class="card-header"><div class="card-title">Bench Aging</div></div><div class="chart-wrap short"><canvas id="chart-aging"></canvas></div>`;
  s3.appendChild(donutCard); s3.appendChild(agingCard); root.appendChild(s3);
  const statusEntries = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  charts.candDonut = A.donutChart(document.getElementById("chart-cand-donut"), statusEntries.map((e) => e[0]), statusEntries.map((e) => e[1]), {});
  const aging = D.benchAgingBuckets(filters);
  charts.aging = A.horizontalBarChart(document.getElementById("chart-aging"), Object.keys(aging), Object.values(aging), { color: "--chart-3" });

  const s4 = section("Candidate Leaderboard", "Click a row to open that candidate's profile.");
  const c4 = card(); const lbHost = document.createElement("div"); c4.appendChild(lbHost);
  s4.appendChild(c4); root.appendChild(s4);
  const leaderboard = cands.map((c) => Object.assign({ name: c.name, id: c.id, role: c.role, status: c.status }, candidateMetrics(c, range))).sort((a, b) => b.submissions - a.submissions).slice(0, 20);
  A.renderTable(lbHost, [
    { key: "name", label: "Candidate" }, { key: "role", label: "Role" },
    { key: "status", label: "Status", render: (r) => `<span class="badge badge-${r.status.toLowerCase().replace(/\s/g, "")}">${r.status}</span>` },
    { key: "submissions", label: "Submissions", align: "right" }, { key: "placements", label: "Placements", align: "right" },
  ], leaderboard, { onRowClick: (r) => openCandidateProfile(r.id) });
}

/* ================= BUSINESS ================= */
function pipelineAndForecast(range, filters) {
  const openSubs = D.queryDataset({ range, filters, dataset: D.SUBMISSIONS }).filter((s) => !s.terminal && s.stageIndex < 4);
  const bestByCandidate = new Map();
  openSubs.forEach((s) => { if (!bestByCandidate.has(s.candidateId) || s.rate > bestByCandidate.get(s.candidateId)) bestByCandidate.set(s.candidateId, s.rate); });
  const avgWeeks = 26;
  const pipelineValue = [...bestByCandidate.values()].reduce((sum, rate) => sum + rate * 40 * avgWeeks, 0);
  const kpi = D.computeKPIs(range, filters);
  const forecastRevenue = pipelineValue * (kpi.placementRate || 0.02);
  return { pipelineValue, forecastRevenue };
}
function renderBusiness(root) {
  const filters = store.get();
  const range = D.resolvePeriod(filters.periodKey);
  const cur = D.computeKPIs(range, filters);
  const pf = pipelineAndForecast(range, filters);

  const s1 = section();
  const kpiHost = document.createElement("div");
  A.renderKPIBand(kpiHost, [
    { label: "Revenue", value: A.formatCurrency(cur.revenue) },
    { label: "Placements", value: A.formatNumber(cur.placements) },
    { label: "Pipeline Value", value: A.formatCurrency(pf.pipelineValue) },
    { label: "Forecast", value: A.formatCurrency(pf.forecastRevenue) },
    { label: "Avg. Value / Placement", value: A.formatCurrency(cur.placements ? cur.revenue / cur.placements : 0) },
  ]);
  s1.appendChild(kpiHost); root.appendChild(s1);

  const s2 = section("Revenue Trend");
  const c2 = card(); c2.innerHTML = `<div class="chart-wrap tall"><canvas id="chart-rev-trend"></canvas></div>`;
  s2.appendChild(c2); root.appendChild(s2);
  const wideRange = [new Date(D.TODAY.getFullYear() - 1, D.TODAY.getMonth() + 1, 1), D.TODAY];
  const series = D.monthlySeries(wideRange, filters);
  charts.revTrend = A.areaChart(document.getElementById("chart-rev-trend"), series.map((s) => s.label), [{ label: "Revenue", data: series.map((s) => s.revenue), color: "--chart-2" }], {});

  const s3 = document.createElement("div"); s3.className = "section grid grid-2";
  const techCard = card(); techCard.innerHTML = `<div class="card-header"><div class="card-title">Revenue by Technology</div></div><div class="chart-wrap"><canvas id="chart-rev-tech"></canvas></div>`;
  const recCard = card(); recCard.innerHTML = `<div class="card-header"><div class="card-title">Revenue by Recruiter</div></div><div class="chart-wrap"><canvas id="chart-rev-rec"></canvas></div>`;
  s3.appendChild(techCard); s3.appendChild(recCard); root.appendChild(s3);
  const roles = D.ROLES.map((r) => {
    const rev = D.queryDataset({ range, filters, dataset: D.PLACEMENTS }).filter((p) => p.roleId === r.id).reduce((s, p) => s + p.value, 0);
    return { technology: r.tech, revenue: rev };
  }).sort((a, b) => b.revenue - a.revenue);
  charts.revTech = A.horizontalBarChart(document.getElementById("chart-rev-tech"), roles.map((r) => r.technology), roles.map((r) => r.revenue), { color: "--chart-2" });
  const recruiters = D.recruiterPerformance(range, filters).sort((a, b) => b.revenue - a.revenue);
  charts.revRec = A.horizontalBarChart(document.getElementById("chart-rev-rec"), recruiters.map((r) => r.recruiter), recruiters.map((r) => r.revenue), {
    color: "--chart-1", onClick: (evt, els) => { if (els.length) goTo("recruiters", { recruiterId: recruiters[els[0].index].id }); },
  });
}

const RENDERERS = { overview: renderOverview, recruiters: renderRecruiters, candidates: renderCandidates, business: renderBusiness };

function renderActive() {
  destroyCharts();
  A.closeSidePanel();
  const root = document.getElementById("tab-content");
  root.innerHTML = "";
  renderCompareTable();
  A.activeFilterChips(document.getElementById("filter-chips"), store, []);
  RENDERERS[activeTab](root);
}

store.subscribe(() => { renderChrome(); renderActive(); });
window.addEventListener("bs-theme-change", () => renderActive());
renderTabs();
renderChrome();
renderActive();
A.wireGlobalSearch(document.getElementById("search-input"), document.getElementById("search-results"), (item) => {
  if (item.type === "candidate") { activeTab = "candidates"; renderTabs(); renderActive(); openCandidateProfile(item.id); }
  if (item.type === "recruiter") goTo("recruiters", { recruiterId: item.id });
  if (item.type === "role") store.set({ roleId: item.id });
  if (item.type === "client") store.set({ clientId: item.id });
  if (item.type === "platform") store.set({ platformId: item.id });
});
</script>
